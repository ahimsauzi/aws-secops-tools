name: Validate CloudFormation Templates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-cfn:
    name: Validate CloudFormation Templates
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1
    
    - name: Install AWS CLI
      run: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
        unzip awscliv2.zip
        sudo ./aws/install --update
        aws --version
    
    - name: Validate IAM Cleanup Template
      run: |
        aws cloudformation validate-template \
          --template-body file://iam-inactive-user-cleanup/cloudformation/template.yaml
    
    - name: CFN Lint - IAM Cleanup
      uses: scottbrenner/cfn-lint-action@v2
      with:
        args: "iam-inactive-user-cleanup/cloudformation/template.yaml"
    
    - name: Comment PR with validation results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        github-token: ${{secrets.GITHUB_TOKEN}}
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ CloudFormation template validation passed!'
          })

  test-python-scripts:
    name: Test Python Scripts
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3 pytest pylint
    
    - name: Lint Python code
      run: |
        pylint --disable=C,R iam-inactive-user-cleanup/scripts/*.py || true
    
    - name: Check Python syntax
      run: |
        python -m py_compile iam-inactive-user-cleanup/scripts/*.py
    
    - name: Security check with Bandit
      run: |
        pip install bandit
        bandit -r iam-inactive-user-cleanup/scripts/ || true

  markdown-lint:
    name: Lint Markdown Files
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Markdown Lint
      uses: actionshub/markdownlint@main
      continue-on-error: true

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'
